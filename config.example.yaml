# Copy to config.yaml and edit. Every value shown is the built-in default.
# Secrets are read from environment variables only:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL, ODDS_API_KEY

scanner:
  price_min: 0.80            # executable price band (VWAP for reference stake)
  price_max: 0.98
  prefilter_pad_low: 0.03    # pads on Gamma's cached quotes before fetching books
  prefilter_pad_high: 0.01
  max_hours_to_end: 720      # only markets resolving within 30 days (null = no limit)
  include_past_end: true     # keep markets past endDate that still trade
  min_gamma_liquidity: 0
  min_gamma_volume: 0
  page_size: 500
  max_markets: 50000
  book_batch_size: 50
  depth_window: 0.02         # ask depth measured within 2c of best ask
  reference_stake_usd: 100   # displayed price = VWAP to buy this much

filters:
  min_edge: 0.04             # estimated probability - (price + fee)
  min_roi: 0.03
  min_liquidity_usd: 250     # ask depth inside depth_window
  max_spread: 0.03
  max_book_age_seconds: 120
  max_source_age_seconds: 300
  min_confidence: 60
  min_rule_clarity: 40
  conflict_threshold: 0.05
  skip_conflicting_sources: true
  require_accepting_orders: true
  require_positive_lower_bound_edge: true
  lower_bound_z: 1.0

fees:
  unknown_fee_rate: 0.07     # worst-case assumption when a fee schedule is unavailable
  unknown_fee_exponent: 1.0

loop_interval_seconds: 60
database_path: data/favorite_hunter.db
