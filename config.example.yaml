# Copy to config.yaml and edit. Every value shown is the built-in default.
# Secrets are read from environment variables only:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL, ODDS_API_KEY

scanner:
  price_min: 0.80            # executable price band (VWAP for reference stake)
  price_max: 0.98
  prefilter_pad_low: 0.03    # pads on Gamma's cached quotes before fetching books
  prefilter_pad_high: 0.01
  max_hours_to_end: 720      # only markets resolving within 30 days (null = no limit)
  include_past_end: true     # keep markets past endDate that still trade
  min_gamma_liquidity: 0
  min_gamma_volume: 0
  page_size: 500
  max_markets: 50000
  book_batch_size: 50
  depth_window: 0.02         # ask depth measured within 2c of best ask
  reference_stake_usd: 100   # displayed price = VWAP to buy this much

filters:
  min_edge: 0.04             # estimated probability - (price + fee)
  min_roi: 0.03
  min_liquidity_usd: 250     # ask depth inside depth_window
  max_spread: 0.03
  max_book_age_seconds: 120
  max_source_age_seconds: 300
  min_confidence: 60
  min_rule_clarity: 40
  conflict_threshold: 0.05
  skip_conflicting_sources: true
  require_accepting_orders: true
  require_positive_lower_bound_edge: true
  lower_bound_z: 1.0

fees:
  unknown_fee_rate: 0.07     # worst-case assumption when a fee schedule is unavailable
  unknown_fee_exponent: 1.0

loop_interval_seconds: 60
database_path: data/favorite_hunter.db

paper:
  enabled: true
  starting_bankroll: 10000
  sizing: fixed              # fixed | kelly
  fixed_stake_usd: 100
  kelly_multiplier: 0.10     # fraction of full Kelly when sizing: kelly
  max_stake_usd: 250
  min_stake_usd: 5
  max_open_positions: 50
  max_exposure_per_event_usd: 500
  max_total_exposure_pct: 0.60
  allow_reentry: false
  record_baseline: true      # blind-favorite observations for comparison
  baseline_stake_usd: 100
  settle_interval_seconds: 300

# FAVORITE EDGE SCORE weights (normalised to 100)
score_weights:
  probability_edge: 30
  source_reliability: 20
  time_remaining: 15
  liquidity: 15
  spread: 10
  event_certainty: 10

scoring:
  edge_full_marks: 0.10      # edge that earns the full edge component

# Confidence weights (normalised to 100). Confidence is not a probability.
confidence_weights:
  model_edge: 18
  source_quality: 15
  independent_sources: 10
  time_remaining: 8
  event_uncertainty: 15
  liquidity: 8
  spread: 6
  depth: 5
  rule_clarity: 15

alerts:
  enabled: false
  telegram: false            # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
  discord: false             # needs DISCORD_WEBHOOK_URL
  min_favorite_edge_score: 65
  min_confidence: 70
  realert_edge_improvement: 0.02
  cooldown_minutes: 60

sources:
  gamma_url: https://gamma-api.polymarket.com
  clob_url: https://clob.polymarket.com
  data_url: https://data-api.polymarket.com
  binance_url: https://data-api.binance.vision
  coinbase_url: https://api.exchange.coinbase.com
  kraken_url: https://api.kraken.com
  deribit_url: https://www.deribit.com
  espn_url: https://site.api.espn.com
  odds_api_url: https://api.the-odds-api.com
  kalshi_url: https://api.elections.kalshi.com/trade-api/v2
  request_timeout: 15
  max_retries: 3
  manual_evidence_path: manual_evidence.yaml
